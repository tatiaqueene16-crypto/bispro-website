<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Database Angkatan 2024</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
  }

  /* --- BACKGROUND UTAMA --- */
  .database-detail-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)), 
                url('https://lh3.googleusercontent.com/d/1Jvgvfzsj0BdoSMGac3139AJF8VhfT7bv') no-repeat center center fixed;
    background-size: cover;
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin-bottom: 20px;
  }

  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA --- */
  .main-content {
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 30px;
    padding-bottom: 40px;
  }

  .page-title-box {
    text-align: center;
    margin-bottom: 5px;
  }

  .page-title {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    margin-bottom: 8px;
  }

  .page-subtitle {
    font-size: clamp(14px, 2vw, 16px);
    color: #e0e0e0;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }

  /* --- CARD KONTEN --- */
  .content-card {
    background: rgba(15, 15, 20, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  }

  .content-card h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 25px;
    color: #ffffff;
    border-left: 4px solid #38bdf8;
    padding-left: 12px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* --- DESAIN WHEEL DENGAN NAMA DI DALAMNYA --- */
  .wheel-section {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
  }

  .wheel-wrapper {
    position: relative;
    padding: 15px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  .wheel-container {
    position: relative;
    width: 360px;
    height: 360px;
    display: flex;
    justify-content: center;
    align-items: center;
    filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.35));
  }

  /* Penunjuk Roda Sci-Fi */
  .wheel-pointer {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 30px solid #f43f5e;
    z-index: 25;
    filter: drop-shadow(0 4px 8px rgba(244, 63, 94, 0.6));
  }

  /* Canvas Roda */
  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #1e293b;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
    transition: transform 4.5s cubic-bezier(0.15, 0, 0.15, 1);
  }

  /* Poros Tengah Roda */
  .wheel-center-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75px;
    height: 75px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border: 4px solid #38bdf8;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 15;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
  }

  .wheel-center-hub span {
    font-size: 11px;
    font-weight: 900;
    color: #38bdf8;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Kotak Hasil Pemenang */
  .winner-display-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 400px;
  }

  .winner-display-box {
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 16px 30px;
    border-radius: 16px;
    width: 100%;
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.05), 0 10px 25px rgba(0,0,0,0.4);
  }

  #wheel-display {
    font-size: 18px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 0.5px;
  }

  #winner-announcement {
    font-size: 15px;
    font-weight: 600;
    color: #34d399;
    min-height: 24px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  /* Tombol Putar */
  .spin-btn {
    background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
    color: #ffffff;
    border: none;
    padding: 14px 40px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .spin-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
    color: #0f172a;
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 12px 30px rgba(255, 255, 255, 0.4);
  }

  .spin-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* --- TABEL DATA MAHASISWA --- */
  .custom-table-wrap {
    width: 100%;
    overflow-x: auto;
    max-height: 380px;
    overflow-y: auto;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .custom-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 14.5px;
  }

  .custom-table th, .custom-table td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .custom-table th {
    background: rgba(30, 41, 59, 0.85);
    color: #38bdf8;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-size: 13px;
    position: sticky;
    top: 0;
    backdrop-filter: blur(8px);
    z-index: 5;
  }

  .custom-table tr:hover {
    background: rgba(56, 189, 248, 0.08);
  }

  .custom-table td {
    color: #f1f5f9;
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
    padding-top: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #38bdf8;
    transform: translateY(-3px);
  }

  /* Responsif HP */
  @media (max-width: 768px) {
    .database-detail-container {
      padding: 20px 15px;
    }
    .header-top {
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .logo-img {
      width: 65px;
      height: 65px;
    }
    .nav-menu {
      width: 100%;
      justify-content: center;
      padding: 5px;
    }
    .nav-menu a {
      padding: 8px 14px;
      font-size: 12.5px;
      flex: 1;
      text-align: center;
    }
    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="database-detail-container">
  <!-- Header: Logo & Menu -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">
    <div class="nav-menu">
      <a href="index.html">HOME</a>
      <a href="class.html">CLASS</a>
      <a href="database.html" class="active">DATABASE</a>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="main-content">
    <div class="page-title-box">
      <div class="page-title">Database Angkatan 2024</div>
      <div class="page-subtitle">Daftar Mahasiswa & Fitur Undian Nama Interaktif</div>
    </div>

    <!-- Bagian Wheel of Names dengan Nama di Roda -->
    <div class="content-card wheel-section">
      <h3>Wheel of Names (Undian Mahasiswa)</h3>
      
      <div class="wheel-wrapper">
        <div class="wheel-container">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" width="400" height="400"></canvas>
          <div class="wheel-center-hub">
            <span>BISPRO</span>
          </div>
        </div>
      </div>

      <div class="winner-display-container">
        <div class="winner-display-box">
          <div id="wheel-display">Tekan Tombol Putar Di Bawah</div>
        </div>
        <div id="winner-announcement"></div>
      </div>

      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Putar Roda 🎲</button>
    </div>

    <!-- Bagian Tabel Data Mahasiswa -->
    <div class="content-card">
      <h3>Daftar Mahasiswa Angkatan 2024</h3>
      <div class="custom-table-wrap">
        <table class="custom-table">
          <thead>
            <tr>
              <th>No</th>
              <th>NIM</th>
              <th>Nama Mahasiswa</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <!-- Data mahasiswa dimuat otomatis via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

<script>
  // Data Mahasiswa
  const students = [
    { nim: "42524001", name: "Ahmad Fauzan" },
    { nim: "42524002", name: "Siti Nurhaliza" },
    { nim: "42524003", name: "Rizky Ramadhan" },
    { nim: "42524004", name: "Aulia Putri" },
    { nim: "42524005", name: "Dimas Anggara" },
    { nim: "42524006", name: "Nurul Hidayah" },
    { nim: "42524007", name: "Fajar Pratama" }
  ];

  // Render Tabel Mahasiswa
  const tableBody = document.getElementById('student-table-body');
  students.forEach((student, index) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${student.nim}</td>
      <td>${student.name}</td>
    `;
    tableBody.appendChild(row);
  });

  // Render Roda Nama menggunakan HTML5 Canvas agar teks muncul presisi di setiap segmen
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
  const totalSlices = students.length;
  const arcSize = (2 * Math.PI) / totalSlices;

  function drawWheel() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2 - 5;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < totalSlices; i++) {
      const startAngle = i * arcSize;
      const endAngle = (i + 1) * arcSize;

      // Gambar Segmen Warna
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Tulis Nama Mahasiswa di dalam Segmen
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(startAngle + arcSize / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px "Segoe UI", sans-serif';
      
      // Batasi panjang teks jika terlalu panjang agar tetap rapi di dalam roda
      let displayName = students[i].name;
      if (displayName.length > 12) {
        displayName = displayName.substring(0, 11) + '..';
      }
      
      ctx.fillText(displayName, radius - 25, 5);
      ctx.restore();
    }
  }

  drawWheel();

  let currentRotation = 0;
  let isSpinning = false;

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;

    const display = document.getElementById('wheel-display');
    const announcement = document.getElementById('winner-announcement');
    const spinBtn = document.getElementById('spinBtn');

    spinBtn.disabled = true;
    announcement.textContent = "";
    display.textContent = "Roda sedang berputar...";
    display.style.color = "#38bdf8";

    // Acak indeks pemenang
    const winnerIndex = Math.floor(Math.random() * students.length);
    const winner = students[winnerIndex];

    // Hitung sudut rotasi agar tepat berhenti di segmen pemenang
    const degreesPerSlice = 360 / totalSlices;
    // Karena penunjuk ada di atas (270 derajat / -90 derajat pada koordinat lingkaran), hitung presisi berhentinya
    const extraSpins = 6 * 360; // 6 putaran penuh
    const targetAngleFromTop = 360 - (winnerIndex * degreesPerSlice + degreesPerSlice / 2);
    const totalRotation = currentRotation + extraSpins + (targetAngleFromTop - (currentRotation % 360) + 360) % 360;
    
    currentRotation = totalRotation;
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      isSpinning = false;
      spinBtn.disabled = false;
      
      display.textContent = winner.name;
      display.style.color = "#34d399";
      announcement.innerHTML = `🎉 Pemenang Terpilih: <strong>${winner.name}</strong> (${winner.nim})`;
    }, 4500);
  }
</script>

</body>
</html>
