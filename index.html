<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  /* --- BACKGROUND UTAMA (DIPERTAJAM & GRADASI GELAP) --- */
  .hero-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    /* Gradasi hitam transparan di atas gambar agar teks kontras dan tidak pecah dipandang */
    background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.65)), 
                url('https://lh3.googleusercontent.com/d/14oVmG_H_0NTpWITJRXdKE7yhB0I56ww0') no-repeat center center;
    background-size: cover;
    /* Mengoptimalkan ketajaman rendering gambar di browser modern */
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
  }

  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  /* Menu Navigasi Kanan Atas */
  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA & EFEK CAHAYA --- */
  .hero-content {
    position: relative;
    text-align: center;
    z-index: 10;
    margin-bottom: 4vh;
  }

  /* Efek Sorotan Sinar / Glow di Belakang Teks */
  .hero-content::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 65%;
    height: 140px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.08) 55%, transparent 100%);
    filter: blur(30px);
    z-index: -1;
    animation: glowPulse 4.5s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.65; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
  }

  /* Animasi Teks Welcome Bergerak Halus */
  @keyframes floatText {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-7px); }
    100% { transform: translateY(0px); }
  }

  .welcome-title {
    font-size: clamp(65px, 11vw, 135px);
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 255, 255, 0.4);
    animation: floatText 4s ease-in-out infinite;
    margin-bottom: 8px;
  }

  /* Animasi Subjudul */
  @keyframes pulseSub {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); }
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.4vw, 25px);
    font-weight: 600;
    color: #f5f5f5;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    letter-spacing: 1px;
    animation: pulseSub 3s ease-in-out infinite;
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
    padding-bottom: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* Responsif Tampilan HP / Tablet */
  @media (max-width: 768px) {
    .hero-container {
      padding: 20px;
    }
    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .nav-menu a {
      padding: 8px 18px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="container"></div> <!-- placeholder -->

<div class="hero-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
    </div>
  </div>

  <!-- Bagian Tengah: Teks Animasi dengan Efek Sinar Cahaya -->
  <div class="hero-content">
    <div class="welcome-title">WELCOME</div>
    <div class="hero-subtitle">English for Business And Professional Communication</div>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

</body>
</html>
