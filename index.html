<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  /* --- BACKGROUND DENGAN GRADASI HITAM --- */
  .hero-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    /* Ganti link di bawah dengan link langsung gambar background Anda */
    background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), 
                url('https://lh3.googleusercontent.com/d/14oVmG_H_0NTpWITJRXdKE7yhB0I56ww0') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
  }

  .logo-img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  /* Menu Navigasi Kanan Atas */
  .nav-menu {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  }

  .nav-menu a {
    text-decoration: none;
    color: #333;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 28px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #1a1a1a;
    color: #ffffff;
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }

  /* --- KONTEN UTAMA (ANIMASI TEKS BERGERAK) --- */
  .hero-content {
    text-align: center;
    z-index: 10;
    margin-bottom: 5vh;
  }

  /* Animasi Floating/Bergerak untuk Teks Welcome */
  @keyframes floatText {
    0% {
      transform: translateY(0px) scale(1);
    }
    50% {
      transform: translateY(-8px) scale(1.02);
    }
    100% {
      transform: translateY(0px) scale(1);
    }
  }

  .welcome-title {
    font-size: clamp(60px, 10vw, 130px);
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 5px 25px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 255, 255, 0.3);
    animation: floatText 4s ease-in-out infinite;
    margin-bottom: 10px;
  }

  /* Animasi Masuk & Berdenyut untuk Subjudul */
  @keyframes pulseSub {
    0% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.01); }
    100% { opacity: 0.85; transform: scale(1); }
  }

  .hero-subtitle {
    font-size: clamp(16px, 2.5vw, 26px);
    font-weight: 600;
    color: #f0f0f0;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    letter-spacing: 1px;
    animation: pulseSub 3s ease-in-out infinite;
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 40px;
    z-index: 10;
    padding-bottom: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* Responsif Tampilan HP */
  @media (max-width: 768px) {
    .hero-container {
      padding: 20px;
    }
    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .nav-menu a {
      padding: 8px 18px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="hero-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <!-- Logo PNUP di Pojok Kiri Atas -->
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <!-- Menu Navigasi -->
    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
    </div>
  </div>

  <!-- Bagian Tengah: Teks Animasi Bergerak -->
  <div class="hero-content">
    <div class="welcome-title">WELCOME</div>
    <div class="hero-subtitle">English for Business And Professional Communication</div>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

</body>
</html>
