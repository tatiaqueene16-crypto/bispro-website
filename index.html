<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    overflow-x: hidden;
  }

  /* --- BACKGROUND UTAMA --- */
  .home-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                url('https://lh3.googleusercontent.com/d/14oVmG_H_0NTpWITJRXdKE7yhB0I56ww0') no-repeat center center fixed;
    background-size: cover;
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin-bottom: 20px;
  }

  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA HOME --- */
  .main-content {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 20px;
    padding-bottom: 40px;
  }

  .hero-title {
    font-size: clamp(35px, 6vw, 55px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    margin-bottom: 5px;
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.5vw, 20px);
    color: #e0e0e0;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    max-width: 700px;
    line-height: 1.5;
  }

  /* --- KUCING KARTUN INTERAKTIF (BISA DIANGKAT / DRAG) --- */
  .climbing-cat-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px 0;
    height: 70px;
    position: relative;
    width: 100%;
  }

  .cat-avatar {
    width: 65px;
    height: 65px;
    cursor: grab;
    position: absolute;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    animation: climbWiggle 2s infinite ease-in-out;
    user-select: none;
    touch-action: none;
    z-index: 99;
  }

  .cat-avatar:active {
    cursor: grabbing;
  }

  /* Animasi goyangan lucu seperti sedang berusaha memanjat */
  @keyframes climbWiggle {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-6px); }
  }

  /* --- TOMBOL AKSI UTAMA --- */
  .hero-btn {
    background: #70b5ff;
    color: #111111;
    text-decoration: none;
    padding: 14px 35px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(112, 181, 255, 0.4);
    transition: all 0.3s ease;
    margin-top: 10px;
  }

  .hero-btn:hover {
    background: #ffffff;
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
    padding-top: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* Responsif Tampilan HP / Tablet */
  @media (max-width: 768px) {
    .home-container {
      padding: 20px;
    }
    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .nav-menu a {
      padding: 8px 18px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="home-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
    </div>
  </div>

  <!-- Konten Utama Halaman Home -->
  <div class="main-content">
    <div class="hero-title">Welcome to BISPRO PNUP</div>
    <div class="hero-subtitle">Program Studi D4 Bisnis Profesional - Politeknik Negeri Ujung Pandang</div>
    
    <!-- Animasi Kucing Kartun Memanjat yang Bisa Diangkat/Digeser (Draggable) -->
    <div class="climbing-cat-container">
      <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f408.png" alt="Kucing Memanjat" class="cat-avatar" id="draggableCat" title="Klik dan seret (angkat) saya!">
    </div>

    <a href="class.html" class="hero-btn">Lihat Jadwal Kelas</a>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

<!-- Skrip JavaScript untuk Interaksi Kucing -->
<script>
  const cat = document.getElementById('draggableCat');
  let isDragging = false;
  let startX, startY, initialX = 0, initialY = 0;

  cat.addEventListener('pointerdown', (e) => {
    isDragging = true;
    cat.setPointerCapture(e.pointerId);
    startX = e.clientX - initialX;
    startY = e.clientY - initialY;
    cat.style.animation = 'none'; // Hentikan animasi goyang sementara diangkat
  });

  cat.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    initialX = e.clientX - startX;
    initialY = e.clientY - startY;
    cat.style.transform = `translate(${initialX}px, ${initialY}px) scale(1.15)`;
  });

  cat.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    cat.releasePointerCapture(e.pointerId);
    cat.style.animation = 'climbWiggle 2s infinite ease-in-out'; // Kembalikan animasi goyang
  });
</script>

</body>
</html>
