<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
  }

  /* --- BACKGROUND UTAMA (Disamakan dengan class & database) --- */
  .hero-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                url('https://lh3.googleusercontent.com/d/1Jvgvfzsj0BdoSMGac3139AJF8VhfT7bv') no-repeat center center fixed;
    background-size: cover;
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin-bottom: 20px;
  }

  /* Ukuran logo disamakan menjadi 75px */
  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  /* Menu Navigasi disamakan persis */
  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA DENGAN EFEK CAHAYA / KILAU (GLOW EFFECT) --- */
  .hero-content {
    position: relative;
    text-align: center;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 5vh;
  }

  /* Efek Kilau Cahaya Putih di Belakang Teks (Glow) */
  .hero-content::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 120px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 60%, transparent 100%);
    filter: blur(25px);
    z-index: -1;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* Animasi Floating/Bergerak untuk Teks Welcome */
  @keyframes floatText {
    0% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-6px) scale(1.01); }
    100% { transform: translateY(0px) scale(1); }
  }

  .welcome-title {
    font-size: clamp(60px, 10vw, 130px);
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 255, 255, 0.4);
    animation: floatText 4s ease-in-out infinite;
    margin-bottom: 5px;
  }

  /* Animasi Subjudul */
  @keyframes pulseSub {
    0% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.01); }
    100% { opacity: 0.85; transform: scale(1); }
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.3vw, 24px);
    font-weight: 600;
    color: #f2f2f2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    letter-spacing: 1px;
    animation: pulseSub 3s ease-in-out infinite;
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
    padding-top: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* Responsif Tampilan HP / Tablet */
  @media (max-width: 768px) {
    .hero-container {
      padding: 20px 15px;
    }

    .header-top {
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo-img {
      width: 65px;
      height: 65px;
    }

    .nav-menu {
      width: 100%;
      justify-content: center;
      padding: 5px;
    }

    .nav-menu a {
      padding: 8px 14px;
      font-size: 12.5px;
      flex: 1;
      text-align: center;
    }

    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="hero-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
      <a href="database.html">DATABASE</a>
    </div>
  </div>

  <!-- Bagian Tengah: Teks Animasi dengan Efek Kilau Cahaya -->
  <div class="hero-content">
    <div class="welcome-title">WELCOME</div>
    <div class="hero-subtitle">English for Business And Professional Communication</div>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

</body>
</html>
