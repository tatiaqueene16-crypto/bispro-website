<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
  }

  /* --- BACKGROUND UTAMA (Tampilan Desktop/Default) --- */
  .hero-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                url('https://lh3.googleusercontent.com/d/1Jvgvfzsj0BdoSMGac3139AJF8VhfT7bv') no-repeat center center fixed;
    background-size: cover;
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
    margin-bottom: 20px;
  }

  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA DENGAN EFEK CAHAYA / KILAU (GLOW EFFECT) --- */
  .hero-content {
    position: relative;
    text-align: center;
    z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 5vh;
  }

  .hero-content::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 120px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 60%, transparent 100%);
    filter: blur(25px);
    z-index: -1;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  @keyframes floatText {
    0% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-6px) scale(1.01); }
    100% { transform: translateY(0px) scale(1); }
  }

  .welcome-title {
    font-size: clamp(60px, 10vw, 130px);
    font-weight: 900;
    font-style: italic;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 255, 255, 0.4);
    animation: floatText 4s ease-in-out infinite;
    margin-bottom: 5px;
  }

  @keyframes pulseSub {
    0% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.01); }
    100% { opacity: 0.85; transform: scale(1); }
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.3vw, 24px);
    font-weight: 600;
    color: #f2f2f2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    letter-spacing: 1px;
    animation: pulseSub 3s ease-in-out infinite;
    margin-bottom: 25px;
  }

  /* --- TOMBOL KIRIM SARAN --- */
  .saran-btn {
    background: #70b5ff;
    color: #111111;
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(112, 181, 255, 0.4);
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .saran-btn:hover {
    background: #ffffff;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
  }

  /* --- MODAL / POP-UP KOTAK SARAN --- */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    padding: 20px;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-box {
    background: rgba(20, 20, 25, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    transform: translateY(20px);
    transition: transform 0.3s ease;
    position: relative;
  }

  .modal-overlay.active .modal-box {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    padding-bottom: 12px;
  }

  .modal-header h3 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }

  .close-btn {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 24px;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .close-btn:hover {
    color: #70b5ff;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #e0e0e0;
  }

  .form-control {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 12px 15px;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
  }

  .form-control:focus {
    border-color: #70b5ff;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 0 10px rgba(112, 181, 255, 0.3);
  }

  textarea.form-control {
    resize: vertical;
    min-height: 110px;
  }

  .submit-saran-btn {
    width: 100%;
    background: #70b5ff;
    color: #111111;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 5px;
    box-shadow: 0 4px 15px rgba(112, 181, 255, 0.4);
  }

  .submit-saran-btn:hover {
    background: #ffffff;
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
    padding-top: 10px;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* --- Responsif Tampilan HP / Tablet --- */
  @media (max-width: 768px) {
    .hero-container {
      padding: 20px 15px;
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.45)), 
                  url('https://lh3.googleusercontent.com/d/11JCY2sI97JlJGCnF0tabMTiawV0cHYdm') no-repeat center center fixed;
      background-size: cover;
    }

    .header-top {
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo-img {
      width: 65px;
      height: 65px;
    }

    .nav-menu {
      width: 100%;
      justify-content: center;
      padding: 5px;
    }

    .nav-menu a {
      padding: 8px 14px;
      font-size: 12.5px;
      flex: 1;
      text-align: center;
    }

    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .modal-box {
      padding: 20px;
    }
  }
</style>
</head>
<body>

<div class="hero-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
      <a href="database.html">DATABASE</a>
    </div>
  </div>

  <!-- Bagian Tengah: Teks Animasi & Tombol Kotak Saran -->
  <div class="hero-content">
    <div class="welcome-title">WELCOME</div>
    <div class="hero-subtitle">English for Business And Professional Communication</div>
    <button class="saran-btn" onclick="openModal()">Kirim Saran & Pesan</button>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

<!-- Modal Pop-Up Formulir Saran -->
<div class="modal-overlay" id="saranModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Kotak Saran & Pesan</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    
    <!-- Formulir terhubung ke Formspree untuk mengirim langsung ke bispro.students@gmail.com -->
    <form action="https://formspree.io/f/xayregkq" method="POST">
      <div class="form-group">
        <label for="name">Nama / Pengirim (Opsional)</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Nama Anda atau Anonim">
      </div>
      
      <div class="form-group">
        <label for="email">Email Anda (Opsional)</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="email@domain.com">
      </div>
      
      <div class="form-group">
        <label for="message">Saran / Pesan Anda</label>
        <textarea id="message" name="message" class="form-control" placeholder="Tuliskan saran, kritik, atau masukan Anda di sini..." required></textarea>
      </div>

      <button type="submit" class="submit-saran-btn">Kirim Pesan</button>
    </form>
  </div>
</div>

<!-- Script untuk Interaksi Modal -->
<script>
  function openModal() {
    document.getElementById('saranModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('saranModal').classList.remove('active');
  }

  // Tutup modal jika user mengklik area luar kotak form
  window.onclick = function(event) {
    let modal = document.getElementById('saranModal');
    if (event.target === modal) {
      closeModal();
    }
  }
</script>

</body>
</html>
