<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISPRO PNUP - Home</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
  }

  /* --- BACKGROUND UTAMA --- */
  .home-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), 
                url('https://lh3.googleusercontent.com/d/1Jvgvfzsj0BdoSMGac3139AJF8VhfT7bv') no-repeat center center fixed;
    background-size: cover;
    image-rendering: -webkit-optimize-contrast;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  /* --- HEADER (LOGO & MENU) --- */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
  }

  .logo-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .nav-menu {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px 8px;
    border-radius: 50px;
    display: flex;
    gap: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .nav-menu a {
    text-decoration: none;
    color: #2b2b2b;
    font-weight: 700;
    font-size: 14.5px;
    padding: 10px 30px;
    border-radius: 40px;
    letter-spacing: 0.5px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-menu a.active, .nav-menu a:hover {
    background: #111111;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  /* --- KONTEN UTAMA HOME --- */
  .hero-content {
    max-width: 850px;
    width: 100%;
    margin: auto auto;
    text-align: center;
    z-index: 10;
    padding: 20px 0;
  }

  .hero-title {
    font-size: clamp(35px, 6vw, 58px);
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    margin-bottom: 15px;
    line-height: 1.2;
  }

  .hero-subtitle {
    font-size: clamp(15px, 2.2vw, 20px);
    color: #e0e0e0;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    margin-bottom: 35px;
    font-weight: 400;
    line-height: 1.5;
  }

  .hero-btn {
    display: inline-block;
    background: #70b5ff;
    color: #111111;
    text-decoration: none;
    padding: 14px 35px;
    border-radius: 40px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(112, 181, 255, 0.4);
    transition: all 0.3s ease;
  }

  .hero-btn:hover {
    background: #ffffff;
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(255, 255, 255, 0.5);
  }

  /* --- FOOTER SOSIAL MEDIA --- */
  .footer-bottom {
    display: flex;
    justify-content: center;
    gap: 45px;
    z-index: 10;
  }

  .footer-bottom a {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    transition: transform 0.3s ease, color 0.3s ease;
  }

  .footer-bottom a:hover {
    color: #70b5ff;
    transform: translateY(-3px);
  }

  /* Responsif Tampilan HP / Tablet */
  @media (max-width: 768px) {
    .home-container {
      padding: 20px 15px;
    }

    /* Penyesuaian Header Mobile */
    .header-top {
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 65px;
      height: 65px;
    }

    .nav-menu {
      width: 100%;
      justify-content: center;
      padding: 5px;
    }

    .nav-menu a {
      padding: 8px 14px;
      font-size: 12.5px;
      flex: 1;
      text-align: center;
    }

    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
  }
</style>
</head>
<body>

<div class="home-container">
  <!-- Bagian Atas: Logo & Menu Navigasi -->
  <div class="header-top">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="logo-img">

    <div class="nav-menu">
      <a href="index.html" class="active">HOME</a>
      <a href="class.html">CLASS</a>
      <a href="database.html">DATABASE</a>
    </div>
  </div>

  <!-- Konten Utama Home / Hero Section -->
  <div class="hero-content">
    <div class="hero-title">Welcome to BISPRO PNUP</div>
    <div class="hero-subtitle">Program Studi D4 Administrasi Bisnis / Business and Professional Communication Politeknik Negeri Ujung Pandang.</div>
    <a href="class.html" class="hero-btn">Jelajahi Jadwal Kelas</a>
  </div>

  <!-- Bagian Bawah: Tautan Sosial Media -->
  <div class="footer-bottom">
    <a href="https://instagram.com/anpnupofficial" target="_blank">@anpnupofficial</a>
    <a href="http://an.politeknikupg.ac.id" target="_blank">an.poliupg.ac.id</a>
    <a href="https://instagram.com/bispropnup" target="_blank">@bispropnup</a>
  </div>
</div>

</body>
</html>
