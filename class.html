<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: linear-gradient(135deg, #e6e0f8 0%, #d2c6ef 100%);
  }

  .bispro-container {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #2b2640;
    padding: 40px 20px;
    box-sizing: border-box;
    width: 100%;
    margin: 0 auto;
    text-align: center;
  }

  .nav-header {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    padding: 8px 0;
    margin-bottom: 35px;
    border-radius: 30px;
    box-shadow: 0 8px 32px 0 rgba(90, 75, 129, 0.1);
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }

  .nav-header a {
    text-decoration: none;
    color: #4a3c6c;
    font-weight: 600;
    margin: 0 6px;
    font-size: 14px;
    padding: 8px 20px;
    border-radius: 20px;
    transition: all 0.3s ease;
    display: inline-block;
  }

  .nav-header a.active, .nav-header a:hover {
    background: linear-gradient(135deg, #5a4b81 0%, #7362a1 100%);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(90, 75, 129, 0.3);
  }

  .class-section {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 40px;
    margin-top: 20px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .class-card {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 30px 25px;
    box-shadow: 0 15px 35px rgba(90, 75, 129, 0.08);
    width: 100%;
    max-width: 280px;
    box-sizing: border-box;
    transition: all 0.4s ease;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .class-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px rgba(90, 75, 129, 0.15);
  }

  .class-img {
    width: 180px;
    height: 180px;
    object-fit: contain;
    border-radius: 16px;
    margin-bottom: 18px;
  }

  .class-title {
    font-size: 19px;
    font-weight: 700;
    color: #2b2640;
    margin: 0;
  }

  .footer-section {
    background: rgba(215, 205, 235, 0.7);
    backdrop-filter: blur(10px);
    padding: 25px 30px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    gap: 22px;
    max-width: 800px;
    margin: 0 auto;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }

  .footer-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .footer-content {
    font-size: 13px;
    color: #3b3054;
  }

  .footer-title {
    font-weight: 700;
    margin-bottom: 8px;
    color: #2b2640;
    font-size: 14px;
  }

  .footer-links div {
    margin-bottom: 5px;
  }

  .footer-links a {
    color: #4a3c6c;
    text-decoration: none;
    font-weight: 500;
  }

  .footer-links a:hover {
    color: #5a4b81;
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .footer-section { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="bispro-container">
  <div class="nav-header">
    <a href="https://sites.google.com/view/bispropnup/home" target="_top">Home</a>
    <a href="#" class="active">Class</a>
  </div>

  <div class="class-section">
    <div class="class-card">
      <img src="URL_LOGO_BISPRO_24" alt="BISPRO 24" class="class-img">
      <div class="class-title">BISPRO 24</div>
    </div>
    <div class="class-card">
      <img src="https://lh3.googleusercontent.com/d/1u4eli7W-2fdtviTKTOh-DzsKv1rCFwLq" alt="BISPRO 25" class="class-img">
      <div class="class-title">BISPRO 25</div>
    </div>
  </div>

  <div class="footer-section">
    <img src="https://lh3.googleusercontent.com/d/1dlXujStWQ5VyDArzjLhR1VpqVaJ9k1oj" alt="Logo PNUP" class="footer-logo">
    <div class="footer-content">
      <div class="footer-title">English for Business And Professional Communication</div>
      <div class="footer-links">
        <div><a href="http://an.politeknikupg.ac.id" target="_blank">an.poltekupg.ac.id</a></div>
        <div><a href="#" target="_blank">@bispropnupofficial</a></div>
        <div><a href="#" target="_blank">@bispropnup</a></div>
        <div><a href="#" target="_blank">@aetheris24_</a></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
